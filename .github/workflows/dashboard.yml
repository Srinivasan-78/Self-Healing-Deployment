name: Publish Dashboard

on:
  workflow_run:
    workflows: ["Self-Healing Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # The deploy job writes the log on its own runner and never commits it,
      # so without this the dashboard would only ever show the log committed
      # in the repo. Pull the log the triggering run produced instead.
      - name: Download deployment log from the triggering run
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: deployment-log
          path: fresh-log
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble site
        run: |
          mkdir -p _site
          cp dashboard/index.html _site/
          if [ -f fresh-log/deployments.json ]; then
            cp fresh-log/deployments.json _site/deployments.json
          else
            cp deployment_log/deployments.json _site/deployments.json
          fi
          sed -i 's|../deployment_log/deployments.json|deployments.json|' _site/index.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
