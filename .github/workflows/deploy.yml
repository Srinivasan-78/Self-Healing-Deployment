name: Self-Healing Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_version:
        description: "Version tag to deploy"
        required: true
        default: "v1"
      force_fail:
        description: "Simulate a broken deploy (chaos test)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible

      # Inputs go through env, never straight into the script body, so a
      # crafted workflow_dispatch input cannot inject shell commands.
      - name: Resolve version tag
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.target_version }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=$SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy with self-healing gate
        working-directory: ansible
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
          FORCE_FAIL: ${{ github.event.inputs.force_fail || 'false' }}
        run: |
          ansible-playbook -i inventory.ini deploy.yml \
            -e "target_version=$TARGET_VERSION" \
            -e "force_fail=$FORCE_FAIL"

      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: deployment-log
          path: deployment_log/deployments.json
          if-no-files-found: warn
