---
- name: Stop failed active container
  command: docker rm -f {{ app_name }}-active
  failed_when: false
  changed_when: true

- name: Rename previous (last-known-good) container back to active
  command: docker rename {{ app_name }}-previous {{ app_name }}-active
  changed_when: true

- name: Confirm restored container is reachable
  wait_for:
    port: "{{ host_port_active }}"
    host: localhost
    delay: 1
    timeout: 15

- name: Record rollback event
  set_fact:
    rollback_recorded_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
