---
- name: Self-healing deployment
  hosts: demo
  gather_facts: false
  vars_files:
    - group_vars/vault.yml

  vars:
    target_version: "{{ target_version | default('v1') }}"
    force_fail: "{{ force_fail | default('false') }}"

  tasks:
    - import_role:
        name: deploy

    - name: Run health validation gate
      command: >
        python3 {{ playbook_dir }}/../healthcheck/validate.py
        --url http://localhost:{{ host_port_active }}{{ health_endpoint }}
        --retries {{ health_retries }}
        --delay {{ health_delay_seconds }}
        --max-response-ms {{ health_max_response_ms }}
      register: health_result
      failed_when: false
      changed_when: false

    - name: Deployment healthy — keep new version, discard previous
      when: health_result.rc == 0
      block:
        - name: Remove now-unneeded previous container
          command: docker rm -f {{ app_name }}-previous
          failed_when: false
          changed_when: true

        - name: Append success event to deployment log
          shell: >
            python3 {{ playbook_dir }}/../scripts/log_event.py
            --status success --version {{ target_version }}
            --log-path {{ deployment_log_path }}
          changed_when: false

    - name: Deployment unhealthy — trigger rollback
      when: health_result.rc != 0
      block:
        - debug:
            msg: "Health check failed for {{ target_version }} — rolling back to last-known-good"

        - import_role:
            name: rollback

        - name: Append rollback event to deployment log
          shell: >
            python3 {{ playbook_dir }}/../scripts/log_event.py
            --status rollback --version {{ target_version }}
            --log-path {{ deployment_log_path }}
            --reason "health_check_failed"
          changed_when: false

        - name: Notify webhook of rollback (Teams/Slack-style)
          uri:
            url: "{{ vault_notify_webhook_url }}"
            method: POST
            body_format: json
            body:
              text: "Rollback triggered: {{ app_name }} {{ target_version }} failed health check"
            status_code: [200, 201, 202, 404]  # 404 expected — webhook URL is a placeholder in this demo
          failed_when: false

        - fail:
            msg: "Deployment of {{ target_version }} failed health checks; rolled back to last-known-good."
