---
# This file would normally be encrypted with `ansible-vault encrypt vault.yml`.
# Committed here in plaintext ONLY because it contains no real secrets —
# it exists to document the vars/vault separation pattern for reviewers.
#
# Real usage:
#   ansible-vault encrypt ansible/group_vars/vault.yml
#   ansible-playbook ... --ask-vault-pass
#
# Referenced via Jinja2 in tasks, e.g.: "{{ vault_notify_webhook_url }}"

vault_notify_webhook_url: "https://example-webhook.invalid/notify"
vault_registry_password: "CHANGE_ME"
